<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Conecta+</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; background: #f8f9fa; color: #1e293b;
      text-align: center; padding: 24px;
    }
    .card {
      background: white; border-radius: 24px; padding: 48px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08); max-width: 400px; width: 100%;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #0d6efd; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block; padding: 12px 32px; border-radius: 999px;
      background: #0d6efd; color: white; font-weight: 700; font-size: 0.95rem;
      text-decoration: none; border: none; cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .footer { margin-top: 32px; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>Parece que no estás conectado a Internet. Conectate a una red y volvé a intentar.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar</button>
    <div class="footer">Conecta+ — No estás solo. Dios sigue contigo.</div>
  </div>
</body>
</html>
