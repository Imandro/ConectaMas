<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Conecta+</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh;
      background: linear-gradient(135deg, #1a0533 0%, #2d1b69 50%, #1a0533 100%);
      color: #fff; text-align: center; padding: 24px;
      position: relative; overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(147, 51, 234, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px; padding: 48px 32px;
      max-width: 400px; width: 100%;
      position: relative; z-index: 1;
      animation: fadeIn 0.6s ease-out;
    }
    .llami {
      width: 120px; height: 120px; margin: 0 auto 20px;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }
    .llami-body { width: 100%; height: 100%; }
    .llami-head {
      width: 80px; height: 80px; background: linear-gradient(135deg, #e8d5b7, #d4b896);
      border-radius: 50%; margin: 0 auto;
      position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .llami-ear {
      width: 18px; height: 28px; background: linear-gradient(135deg, #d4b896, #c4a07a);
      border-radius: 50% 50% 30% 30%;
      position: absolute; top: -10px;
    }
    .llami-ear.left { left: 12px; transform: rotate(-15deg); }
    .llami-ear.right { right: 12px; transform: rotate(15deg); }
    .llami-eye {
      width: 14px; height: 16px; background: #2d1b69;
      border-radius: 50%; position: absolute; top: 32px;
    }
    .llami-eye.left { left: 18px; }
    .llami-eye.right { right: 18px; }
    .llami-eye::after {
      content: ''; width: 5px; height: 5px; background: #fff;
      border-radius: 50%; position: absolute; top: 3px; left: 3px;
    }
    .llami-nose {
      width: 10px; height: 8px; background: #c4a07a;
      border-radius: 50%; position: absolute; top: 44px; left: 50%;
      margin-left: -5px;
    }
    .llami-mouth {
      width: 20px; height: 10px; border-bottom: 3px solid #8b6f4e;
      border-radius: 0 0 20px 20px;
      position: absolute; top: 52px; left: 50%; margin-left: -10px;
    }
    .llami-scarf {
      width: 60px; height: 12px;
      background: linear-gradient(90deg, #8b5cf6, #6d28d9, #8b5cf6);
      border-radius: 4px; margin: -6px auto 0;
      position: relative; z-index: 2;
    }
    .signal-bars {
      display: flex; justify-content: center; gap: 6px;
      margin: 24px 0;
    }
    .signal-bar {
      width: 6px; background: linear-gradient(to top, rgba(255,255,255,0.2), rgba(255,255,255,0.6));
      border-radius: 3px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .signal-bar:nth-child(1) { height: 24px; animation-delay: 0s; }
    .signal-bar:nth-child(2) { height: 36px; animation-delay: 0.2s; }
    .signal-bar:nth-child(3) { height: 48px; animation-delay: 0.4s; }
    .signal-bar:nth-child(4) { height: 60px; animation-delay: 0.6s; }
    .signal-bar:nth-child(5) { height: 72px; animation-delay: 0.8s; }
    h1 {
      font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.95rem; color: rgba(255,255,255,0.7);
      line-height: 1.7; margin-bottom: 28px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 36px; border-radius: 999px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff; font-weight: 700; font-size: 0.95rem;
      text-decoration: none; border: none; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(109, 40, 217, 0.4);
    }
    .btn:hover { transform: scale(1.03); box-shadow: 0 6px 28px rgba(109, 40, 217, 0.5); }
    .btn:active { transform: scale(0.97); }
    .btn .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      display: none; animation: spin 0.6s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .label { display: none; }
    .footer {
      margin-top: 32px; font-size: 0.75rem; color: rgba(255,255,255,0.4);
    }
    .stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .star {
      position: absolute; width: 2px; height: 2px;
      background: #fff; border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="card">
    <div class="llami">
      <div class="llami-head">
        <div class="llami-ear left"></div>
        <div class="llami-ear right"></div>
        <div class="llami-eye left"></div>
        <div class="llami-eye right"></div>
        <div class="llami-nose"></div>
        <div class="llami-mouth"></div>
      </div>
      <div class="llami-scarf"></div>
    </div>
    <div class="signal-bars">
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
    </div>
    <h1>Sin conexión</h1>
    <p>Parece que no estás conectado a Internet. Conectate a una red y volvé a intentar.</p>
    <button class="btn" id="reloadBtn" onclick="reload()">
      <span class="spinner"></span>
      <span class="label">↻ Reintentar</span>
    </button>
    <div class="footer">Conecta+ — No estás solo. Dios sigue contigo.</div>
  </div>
  <script>
    function reload() {
      document.getElementById('reloadBtn').classList.add('loading');
      setTimeout(() => window.location.reload(), 600);
    }
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
