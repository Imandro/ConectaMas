name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (e.g. 7)'
        required: false
        default: '7'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Update version
        run: |
          sed -i "s/version: .*/version: ${{ github.event.inputs.version }}+${{ github.event.inputs.version_code }}/" pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ConectaPlus-${{ github.event.inputs.version }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConectaPlus-APK
          path: flutter-app/build/app/outputs/flutter-apk/ConectaPlus-*.apk
