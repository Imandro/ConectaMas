name: Build AAB

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > conectaplus.keystore

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install bubblewrap
        run: npm install -g @pwabuilder/cli

      - name: Generate Android project
        run: npx @pwabuilder/cli build --signing "none" --directory "."
        env:
          CI: true

      - name: Copy keystore to project
        run: cp conectaplus.keystore bwrap-build/conectaplus.keystore

      - name: Build AAB
        run: |
          cd bwrap-build
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore conectaplus.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            bwrap-build/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: Rename AAB
        run: |
          mv bwrap-build/app/build/outputs/bundle/release/app-release.aab \
             ConectaPlus-signed.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ConectaPlus-AAB
          path: ConectaPlus-signed.aab
